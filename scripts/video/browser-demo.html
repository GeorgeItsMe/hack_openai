<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Tabby — real browser walkthrough</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:1920px;height:1080px;overflow:hidden}body{background:#f6f5f0;color:#272923;font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}#film{position:relative;width:1920px;height:1080px;background:radial-gradient(ellipse at 85% 45%,#ffeadb88,transparent 68%)}.logo{position:absolute;left:86px;top:66px;width:158px}.edition{position:absolute;right:86px;top:82px;font-size:15px;letter-spacing:2.5px;color:#77796f}.edition i{display:inline-block;width:8px;height:8px;border-radius:50%;background:#ff7745;margin-right:12px}.orb{position:absolute;right:-350px;top:-180px;width:1350px;height:1350px;border:1px solid #edc9b1;border-radius:50%}.orb.two{right:-280px;top:-110px;width:1210px;height:1210px}.backplate{position:absolute;left:598px;top:176px;width:1230px;height:747px;border-radius:25px;background:#ff7745;transform:rotate(2deg)}.window{position:absolute;left:586px;top:168px;width:1248px;height:748px;border-radius:18px;overflow:hidden;background:#fff;box-shadow:0 25px 75px #81462125,0 1px 4px #27292320;border:1px solid #d7d7ce}.footage{position:absolute;width:1248px;height:748px;max-width:none;transform-origin:0 0;will-change:transform}.narrative{position:absolute;left:86px;top:318px;width:450px}.kicker{font-size:16px;letter-spacing:2px;color:#a95330;font-weight:600;margin-bottom:27px}h1{font-size:72px;line-height:1.04;font-weight:570;letter-spacing:-4px;margin:0}h1 em{font-family:Georgia,serif;font-weight:400;color:#b35a36}.sub{font-size:22px;line-height:1.65;color:#77796f;margin:26px 0 0;max-width:400px}.steps{display:flex;gap:11px;margin-top:37px}.steps i{width:42px;height:4px;background:#dedfd5;border-radius:8px}.steps i.on{background:#ff7745}.note{position:absolute;left:86px;bottom:72px;color:#77796f;font-size:15px;line-height:1.8}.note strong{color:#626955;font-weight:550}.time{position:absolute;right:87px;bottom:77px;font:14px ui-monospace,monospace;letter-spacing:2px;color:#77796f}.progress{position:absolute;bottom:0;left:0;width:1920px;height:5px;background:#e5e1d6}.progress i{display:block;height:100%;background:#ff7745;transform-origin:0 0}.cover{position:absolute;inset:0;background:#f6f5f0;display:flex;flex-direction:column;align-items:center;justify-content:center}.cover .mark{width:133px;height:133px;object-fit:contain;margin-bottom:28px}.cover h2{font-size:102px;font-weight:540;line-height:1.05;letter-spacing:-5.5px;text-align:center;margin:0}.cover em{font-family:Georgia,serif;color:#b85d38;font-weight:400}.cover p{font-size:24px;color:#77796f;margin:27px 0}.cover .wordmark{width:164px;margin-top:20px}.tag{margin-top:31px;padding:12px 23px;border:1px solid #ded8ca;border-radius:30px;font-size:14px;letter-spacing:2px;color:#77796f}.cover .stamp{position:absolute;bottom:62px;font-size:14px;letter-spacing:2px;color:#77796f}
</style>
<div id="film"><div class="orb"></div><div class="orb two"></div><img class="logo" src="/brand/tabby-logo.svg"><div class="edition"><i></i>REAL BROWSER WALKTHROUGH</div>
<div class="backplate" id="plate"></div><div class="window" id="window"><img class="footage" id="footage"></div>
<div class="narrative" id="narrative"><div class="kicker" id="kicker"></div><h1 id="headline"></h1><p class="sub" id="sub"></p><div class="steps"><i></i><i></i><i></i><i></i><i></i></div></div>
<div class="note"><strong>Chrome extension · Real DeepSeek responses</strong><br>Recorded workflow · Timing condensed</div><div class="time" id="time"></div>
<div class="cover" id="cover"><img class="mark" src="/brand/tabby-mark-task.svg"><h2 id="cover-title"></h2><p id="cover-sub"></p><img class="wordmark" src="/brand/tabby-logo.svg"><div class="tag" id="cover-tag"></div><div class="stamp">BUILT FOR THE HACKATHON</div></div>
<div class="progress"><i id="progress"></i></div></div>
<script>
const $=id=>document.getElementById(id),clamp=x=>Math.max(0,Math.min(1,x)),ease=x=>{x=clamp(x);return x*x*(3-2*x)},mix=(a,b,p)=>a+(b-a)*p;
let edit,images={};
window.ready=(async()=>{edit=await(await fetch('/edit.json')).json();await document.fonts.ready;await Promise.all([...new Set(edit.clips.flatMap(c=>c.frames.map(f=>f.file)))].map(async file=>{const img=new Image();img.src='/capture/'+file;await img.decode();images[file]=img;}));await Promise.all([...document.images].filter(i=>i.src).map(i=>i.decode()));})();
window.render=async t=>{await window.ready;const c=edit.clips.find(c=>t>=c.start&&t<c.end)||edit.clips.at(-1),local=t-c.start,p=clamp(local/(c.end-c.start));
 const source=mix(c.frames[0].at,c.frames.at(-1).at,p);let frame=c.frames[0];for(const f of c.frames){if(f.at>source)break;frame=f;} $('footage').src=images[frame.file].src;await $('footage').decode();
 const z=mix(c.zoom[0],c.zoom[1],ease(p)),y=mix(c.pan[0],c.pan[1],ease(p));$('footage').style.transform=`translate(${1248*(1-z)}px,${y}px) scale(${z})`;
 $('kicker').textContent=c.kicker;$('headline').innerHTML=c.title;$('sub').textContent=c.sub;const enter=ease(local/.5);$('narrative').style.transform=`translateY(${(1-enter)*14}px)`;$('narrative').style.opacity=enter;document.querySelectorAll('.steps i').forEach((e,i)=>e.classList.toggle('on',i===c.chapter));
 const isEnd=t>=57,coverAlpha=isEnd?ease((t-57)/.45):1-ease((t-2.5)/.5);$('cover').style.opacity=coverAlpha;$('cover').style.transform=`scale(${isEnd?.985+.015*ease((t-57)/1):1})`;$('cover-title').innerHTML=isEnd?'Less chaos.<br>More <em>focus.</em>':'Your browser.<br>A little more <em>focus.</em>';$('cover-sub').textContent=isEnd?'Your goal. Your next small step.':'A real day with Tabby, in one minute.';$('cover-tag').textContent=isEnd?'FOCUS · TASKS · TABS':'CHROME EXTENSION · LIVE AI';
 $('time').textContent=String(Math.floor(t)).padStart(2,'0')+' / 60';$('progress').style.transform=`scaleX(${t/60})`;
};
</script></html>
